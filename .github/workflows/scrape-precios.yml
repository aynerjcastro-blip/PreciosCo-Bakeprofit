name: Scraping de precios

on:
  # schedule:
  #   # 10:00 UTC = 5:00 am en Colombia (UTC-5). Activar cuando el equipo lo decida.
  #   - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dominios:
        description: "Qué scrapers correr"
        type: choice
        options: [todos, supermercados, droguerias]
        default: todos
      tiendas_supermercados:
        description: "Supermercados, separados por coma (d1, jumbo, olimpica, exito). Vacío = d1,jumbo,olimpica"
        required: false
        default: ""
      tiendas_droguerias:
        description: "Droguerías, separadas por coma (rebaja, farmatodo, farmanorte). Vacío = todas con targets activos"
        required: false
        default: ""

# Una sola corrida a la vez: los scrapers comparten la base y la misma IP de salida.
concurrency:
  group: scraper-precios
  cancel-in-progress: false

jobs:
  scrape:
    name: Scraper de ${{ matrix.dominio }}
    # Con "dominios" = todos (o en la corrida programada, sin inputs) corren los dos.
    if: ${{ (inputs.dominios || 'todos') == 'todos' || inputs.dominios == matrix.dominio }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false      # la falla de un scraper no cancela a los demás
      max-parallel: 1       # uno detrás de otro, en el orden de la matriz
      matrix:
        dominio: [supermercados, droguerias]

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/supermercados/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scrapers/supermercados/requirements.txt

      - name: Ejecutar scraper de ${{ matrix.dominio }}
        working-directory: scrapers/${{ matrix.dominio }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          # Éxito está en pausa: el valor por defecto de supermercados no lo incluye.
          SOLO_TIENDAS: ${{ matrix.dominio == 'supermercados' && (inputs.tiendas_supermercados || 'd1,jumbo,olimpica') || inputs.tiendas_droguerias }}
        run: python scraper_${{ matrix.dominio }}.py

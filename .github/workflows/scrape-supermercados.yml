name: Scraping de precios

on:
  # schedule:
  #   # 10:00 UTC = 5:00 am en Colombia (UTC-5). Ajusta la hora a gusto.
  #   - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      tiendas:
        description: "Tiendas separadas por coma (d1, jumbo, olimpica, exito, la rebaja, farmatodo, farmanorte, cutis, medipiel, bellapiel). Vacío = todas (excepto exito)"
        required: false
        default: "d1,jumbo,olimpica,la rebaja,farmatodo,farmanorte,cutis,medipiel,bellapiel"

concurrency:
  group: scraper-supermercados
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Instalar dependencias
        working-directory: scrapers
        run: pip install -r requirements.txt

      - name: Correr scraper de supermercados
        if: |
          contains(github.event.inputs.tiendas, 'd1') ||
          contains(github.event.inputs.tiendas, 'jumbo') ||
          contains(github.event.inputs.tiendas, 'olimpica') ||
          contains(github.event.inputs.tiendas, 'exito') ||
          github.event.inputs.tiendas == ''
        working-directory: scrapers/supermercados
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          SOLO_TIENDAS: ${{ github.event.inputs.tiendas || 'd1,jumbo,olimpica' }}
        run: python scraper_supermercados.py

      - name: Correr scraper de droguerías
        if: |
          contains(github.event.inputs.tiendas, 'la rebaja') ||
          contains(github.event.inputs.tiendas, 'farmatodo') ||
          contains(github.event.inputs.tiendas, 'farmanorte') ||
          github.event.inputs.tiendas == ''
        working-directory: scrapers/droguerias
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          SOLO_TIENDAS: ${{ github.event.inputs.tiendas || 'la rebaja,farmatodo,farmanorte' }}
        run: python scraper_droguerias.py

      - name: Correr scraper de cuidado facial
        if: |
          contains(github.event.inputs.tiendas, 'cutis') ||
          contains(github.event.inputs.tiendas, 'medipiel') ||
          contains(github.event.inputs.tiendas, 'bellapiel') ||
          github.event.inputs.tiendas == ''
        working-directory: scrapers/facial
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          SOLO_TIENDAS: ${{ github.event.inputs.tiendas || 'cutis,medipiel,bellapiel' }}
        run: python scraper_cuidado_facial.py
name: Scraping de precios - Supermercados

on:
  # schedule:
  #   # 10:00 UTC = 5:00 am en Colombia (UTC-5). Ajusta la hora a gusto.
  #   - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      tiendas:
        description: "Tiendas a procesar, separadas por coma (exito, jumbo, olimpica, d1). Vacío = todas"
        required: false
        default: "exito"

concurrency:
  group: scraper-supermercados   # evita dos corridas a la vez (duplicarían filas en scraped_offers)
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/supermercados/requirements.txt

      - name: Instalar dependencias
        working-directory: scrapers/supermercados
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        working-directory: scrapers/supermercados
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          SOLO_TIENDAS: ${{ github.event.inputs.tiendas }}
        run: python scraper_supermercados.py
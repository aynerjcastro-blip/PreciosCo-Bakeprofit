name: Scraper PreciosCo

on:
  # Permitir ejecución manual desde la pestaña Actions de GitHub
  workflow_dispatch:
  
  # El cron está comentado para cumplir con la regla de ejecución manual inicial
  # schedule:
  #   - cron: '0 */6 * * *' # Ejemplo: cada 6 horas en UTC

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Controla el límite de tiempo del job

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar script del Scraper
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          python scraper.py
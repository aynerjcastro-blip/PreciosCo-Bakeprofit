# Perfil usado al ejecutar la aplicacion dentro de Docker.
# Las credenciales y secretos se reciben exclusivamente por variables de entorno.

# Base de datos Supabase
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Esquema JPA en el entorno Docker.
# validate no crea ni modifica tablas; usa update solo si tu equipo lo necesita.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID}

# Correo de avisos
app.notifications.mail.enabled=${MAIL_ENABLED:false}
app.notifications.mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Procesador de staging
preciosco.staging.enabled=${STAGING_ENABLED:false}
# Perfil usado al ejecutar la aplicacion dentro de Docker.
# Las credenciales y secretos se reciben exclusivamente por variables de entorno.

# Base de datos Supabase
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Esquema JPA en el entorno Docker.
# validate no crea ni modifica tablas; usa update solo si tu equipo lo necesita.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:}

# Correo de avisos
app.notifications.mail.enabled=${MAIL_ENABLED:false}
app.notifications.mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Procesador de staging
preciosco.staging.enabled=${STAGING_ENABLED:false}

# fixedDelay: la siguiente corrida empieza 8 h después de que termina la anterior (unas 3 al día)
preciosco.staging.run-interval=PT8H
preciosco.staging.initial-delay=PT2M
preciosco.staging.batch-size=50
preciosco.staging.processed-retention=2d
preciosco.staging.unclassified-retention=7d

# Dominios = nombres de categorías raíz, separados por comas
preciosco.staging.existing-brands-only-domains=Repuestos
preciosco.staging.identity-pending-domains=Repuestos

# Identidad secundaria: solo tiendas autorizadas; códigos locales no identifican globalmente.
preciosco.staging.secondary-identity.stores=${SECONDARY_IDENTITY_STORES:bellapiel}
preciosco.staging.secondary-identity.minimum-score=${SECONDARY_IDENTITY_MINIMUM_SCORE:0.90}
preciosco.staging.secondary-identity.minimum-margin=${SECONDARY_IDENTITY_MINIMUM_MARGIN:0.08}
preciosco.staging.secondary-identity.candidate-limit=${SECONDARY_IDENTITY_CANDIDATE_LIMIT:100}

# Login Attemp Limiting 
app.security.max-failed-attempts=5
app.security.lock-duration-minutes=15

# Token Bucket
app.rate-limit.requests-per-minute=60

## Integración de IA GEMINI FLASH
preciosco.ai.api-key=${AI_API_KEY:}
preciosco.ai.model=${AI_MODEL:gemini-3.5-flash-lite}
preciosco.ai.thinking-level=${AI_THINKING_LEVEL:minimal}

# Cuota de consultas IA por plan
app.ai-quota.free-monthly-limit=${AI_FREE_MONTHLY_LIMIT:20}

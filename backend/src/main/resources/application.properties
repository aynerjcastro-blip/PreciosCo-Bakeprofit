spring.application.name=bakeprofit
spring.profiles.active=local
logging.level.com.comprasco.bakeprofit=TRACE
jwt.expiration=86400000


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Inicialización del Seed Data para pruebas
spring.sql.init.mode=always
=======
# --- Correo de avisos (RF28). Desactivado por defecto: se activa en application-local.properties
#     o con variables de entorno. Las credenciales NUNCA van aquí. ---
app.notifications.mail.enabled=${MAIL_ENABLED:false}
app.notifications.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Tiempos máximos (ms): un SMTP caído no deja colgado al detector
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


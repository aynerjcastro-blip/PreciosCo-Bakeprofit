services:
  backend:
    build:
      context: ./backend
    container_name: bakeprofit-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Define GOOGLE_CLIENT_ID en el archivo .env de la raíz}
    container_name: bakeprofit-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
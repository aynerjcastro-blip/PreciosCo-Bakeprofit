<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PreciosCo</title>

    <!-- Ícono de la pestaña (favicon) y de acceso directo en móviles -->
    <link rel="icon" type="image/png" href="/assets/images/LogoPreciosCo.png" />
    <link rel="apple-touch-icon" href="/assets/images/LogoPreciosCo.png" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
    
    <!-- Script de inicialización del tema (Evita el FOUC) -->
    <script>
      (() => {
        const saved = localStorage.getItem("preciosco_theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>
  </head>
  <body>
    <!-- React se inyectará aquí -->
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>

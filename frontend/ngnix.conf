server {
  # Nginx escucha en el puerto 80 dentro del contenedor
  listen 80;
  server_name _;

  # Carpeta donde Docker copió el build de React
  root /usr/share/nginx/html;
  index index.html;

  # Permite recargar rutas de React como /login o /productos
  location / {
    try_files $uri $uri/ /index.html;
  }

# Reenvía peticiones /api/ al servicio Spring llamado "backend"
  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador - PreciosCo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link rel="preload" href="/frontend/styles/normalize.css" as="style">
    <link rel="stylesheet" href="/frontend/styles/normalize.css">
    <link rel="stylesheet" href="/frontend/styles/tokens.css">
    <link rel="stylesheet" href="/frontend/styles/base.css">
    <link rel="stylesheet" href="/frontend/styles/layout.css">
    <link rel="stylesheet" href="/frontend/styles/comparator.css">
</head>

<body>
    <header class="site-header">
        <div class="site-header__inner">
            <img src="/frontend/assets/icons/meatball-menu.png" alt="Abrir menú" width="30">
            <a href="/frontend/index.html" class="site-header__title">
                <img src="/frontend/assets/images/titulo-preciosCo.png" alt="PreciosCo" class="logo-img">
            </a>
            <div class="header-actions">
                <a href="/frontend/pages/buscar.html">
                    <img src="/frontend/assets/icons/find.png" alt="Buscar" width="30">
                </a>
                <img src="/frontend/assets/icons/user.png" alt="Mi cuenta" width="30">
            </div>
        </div>
    </header>

    <nav class="site-nav">
        <ul class="site-nav__list">
            <a href="/frontend/index.html">Inicio</a>
            <a href="/frontend/pages/buscar.html">Buscar</a>
            <a href="/frontend/pages/comparador.html">Comparador</a>
        </ul>
    </nav>

    <main class="comparador">
        <div class="comparador__header">
            <h1 class="comparador__title" id="product-name">Comparando precios...</h1>
            <p class="comparador__subtitle">Precios ordenados de menor a mayor entre tiendas activas</p>
        </div>

        <div id="results-container" class="price-list"></div>
        <p id="error-msg" class="comparador__error" style="display:none;">
            No se encontraron precios para este producto.
        </p>
    </main>

    <footer class="site-footer">
        <ul class="site-footer__links">
            <li><a href="#"><h5>Preguntas Y Respuestas</h5></a></li>
            <li><a href="#"><h5>Contáctanos</h5></a></li>
        </ul>
        <h5 class="site-footer__copy">Todos los derechos reservados</h5>
    </footer>

    <script src="/frontend/js/ui/comparator.js"></script>
</body>

</html>

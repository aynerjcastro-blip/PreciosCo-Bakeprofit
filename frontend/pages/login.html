<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="preload" href="/frontend/styles/normalize.css" as="style">
    <link rel="stylesheet" href="/frontend/styles/normalize.css">
    <link rel="stylesheet" href="/frontend/styles/tokens.css">
    <link rel="stylesheet" href="/frontend/styles/base.css">
    <link rel="stylesheet" href="/frontend/styles/layout.css">
    <link rel="stylesheet" href="/frontend/styles/forms.css">
    <script type="module" src="/frontend/js/ui/login.js"></script>
</head>

<body>
    <header class="site-header">
        <div class="site-header__inner">
            <img src="/frontend/assets/icons/meatball-menu.png" alt="Abrir menú" width="30">
            <a href="/frontend/index.html" class="site-header__title">
                <img src="/frontend/assets/images/titulo-preciosCo.png" alt="PreciosCo" class="logo-img">
            </a>
            <div class="header-actions">
                <a href="/frontend/pages/buscar.html">
                    <img src="/frontend/assets/icons/find.png" alt="Buscar" width="30">
                </a>
                <img src="/frontend/assets/icons/user.png" alt="Mi cuenta" width="30">
            </div>
        </div>
    </header>


    <div class="auth-form-wrapper">
        <form class="auth-form">
            <div class="auth-form__field">
                <label class="auth-form__label" for="login-email">Correo:</label>
                <input type="email" id="login-email" name="email" required>
            </div>
            <div class="auth-form__field">
                <label class="auth-form__label" for="login-password">Contraseña:</label>
                <input type="password" id="login-password" name="password" required>
            </div>

            <button type="submit" class="auth-form__submit">Iniciar sesión</button>

            <p class="auth-form__switch">
                ¿No tienes cuenta? <a href="/frontend/pages/register.html">Regístrate</a>
            </p>
        </form>
    </div>

    <footer class="site-footer">
        <ul class="site-footer__links">
            <li><a href="#">
                    <h5>Preguntas Y Respuestas</h5>
                </a></li>
            <li><a href="#">
                    <h5>Contáctanos</h5>
                </a></li>
        </ul>
        <h5 class="site-footer__copy">Todos los derechos reservados</h5>
    </footer>
</body>

</html>

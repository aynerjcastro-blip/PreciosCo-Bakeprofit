<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="preload" href="/frontend/styles/normalize.css" as="style">
    <link rel="stylesheet" href="/frontend/styles/normalize.css">
    <script>(() => { const saved = localStorage.getItem("preciosco_theme"); if (saved) document.documentElement.setAttribute("data-theme", saved); })();
    </script>
    <link rel="stylesheet" href="/frontend/styles/tokens.css">
    <link rel="stylesheet" href="/frontend/styles/base.css">
    <link rel="stylesheet" href="/frontend/styles/layout.css">
    <link rel="stylesheet" href="/frontend/styles/forms.css">
    <script type="module" src="/frontend/js/ui/register.js"></script>
</head>

<body>
    <header class="site-header">
        <div class="site-header__inner">
            <button class="icon-button" type="button" aria-label="Abrir menú">
                <span class="icon icon--menu"></span>
            </button>

            <a href="/frontend/index.html" class="site-header__title">
                <span class="logo-text">Precios</span>
                <img src="/frontend/assets/images/co-badge.png" alt="" class="logo-co">
            </a>

            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle">Modo oscuro</button>

                <a href="/frontend/pages/buscar.html" class="icon-button" aria-label="Buscar">
                    <span class="icon icon--search"></span>
                </a>

                <a href="/frontend/pages/login.html" class="icon-button" aria-label="Iniciar sesión">
                    <span class="icon icon--user"></span>
                </a>
            </div>
        </div>
    </header>


    <div id="registro" class="auth-form-wrapper">
        <form class="auth-form">
            <div class="auth-form__field">
                <label class="auth-form__label" for="register-name">Nombre:</label>
                <input type="text" id="register-name" name="name" required>
            </div>
            <div class="auth-form__field">
                <label class="auth-form__label" for="register-email">Correo:</label>
                <input type="email" id="register-email" name="email" required>
            </div>
            <div class="auth-form__field">
                <label class="auth-form__label" for="register-phone">Número:</label>
                <input type="number" id="register-phone" name="phone">
            </div>
            <div class="auth-form__field">
                <label class="auth-form__label" for="register-password">Contraseña:</label>
                <input type="password" id="register-password" name="password" required>
            </div>

            <div class="auth-form__terms">
                <input type="checkbox" id="register-terms" name="terms" required>
                <span>Aceptar los términos y condiciones</span>
            </div>

            <button type="submit" class="auth-form__submit">Registrarse</button>
        </form>
    </div>

    <script type="module">
        import { initTheme } from "/frontend/js/utils/theme.js";
        initTheme();
    </script>
</body>

</html>

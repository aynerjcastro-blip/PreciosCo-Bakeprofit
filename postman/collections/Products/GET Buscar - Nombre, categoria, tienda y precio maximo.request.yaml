$kind: http-request
name: GET Buscar - Nombre, categoria, tienda y precio maximo
description: "SCRUM-278 (HU-06b, Anexo B RF06: filtrar por Éxito y precio máximo). Define en tu entorno idCategoriaGranos (categoría hoja) e idTiendaExito. Esperado: 200, una página con content y page, y solo productos de esa categoría cuyo nombre contiene 'arroz' sin importar tildes ni mayúsculas. Para confirmar que el precio vigente en Éxito es <= 10000, abre cualquiera en el comparador."
url: http://localhost:8080/api/products/search?name=ARROZ&idCategory={{idCategoriaGranos}}&storeId={{idTiendaExito}}&maxPrice=10000&page=0&size=20
method: GET
scripts:
  - type: afterResponse
    code: |-
      const sinTildes = (texto) => texto.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("La respuesta es una página con content y page", function () {
          const body = pm.response.json();
          pm.expect(body.content).to.be.an("array");
          pm.expect(body.page).to.include.keys("size", "number", "totalElements", "totalPages");
          pm.expect(body.page.size).to.eql(20);
      });
      pm.test("Todos los productos contienen la palabra buscada", function () {
          pm.response.json().content.forEach((producto) => {
              pm.expect(sinTildes(producto.name)).to.include("arroz");
              pm.expect(producto.active).to.eql(true);
          });
      });
    language: text/javascript
order: 3000

$kind: http-request
name: GET Buscar - Orden desconocido
description: "HT-13. El parámetro sort solo acepta SAVINGS (por defecto) o NAME. Esperado: 400 con el formato uniforme (RNF08)."
url: http://localhost:8080/api/products/search?sort=PRECIO
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("El error tiene el formato uniforme", function () {
          pm.expect(pm.response.json()).to.include.keys("timestamp", "status", "error", "message", "path");
      });
    language: text/javascript
order: 3005

$kind: http-request
name: GET Buscar - Por seccion ordenado por ahorro
description: "HT-13 (SCRUM-309, DP-26, DP-39). Define idSeccionSupermercados (categoría raíz). Esperado: 200; cada producto tiene precio en una tienda activa de la sección, y el ahorro (maxPrice - minPrice) / maxPrice nunca sube de un producto al siguiente."
url: http://localhost:8080/api/products/search?sectionId={{idSeccionSupermercados}}&page=0&size=20
method: GET
scripts:
  - type: afterResponse
    code: |-
      const ahorro = (p) => (p.maxPrice && p.maxPrice > 0) ? (p.maxPrice - p.minPrice) / p.maxPrice : 0;

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Ordenado por mayor ahorro", function () {
          const ahorros = pm.response.json().content.map(ahorro);
          for (let i = 1; i < ahorros.length; i++) {
              pm.expect(ahorros[i]).to.be.at.most(ahorros[i - 1] + 1e-9);
          }
      });
    language: text/javascript
order: 3003

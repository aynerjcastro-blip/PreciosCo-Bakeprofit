name: GET Buscar - Seccion Cuidado facial
description: "HU-30. Define idSeccionCuidadoFacial (categoría raíz). Esperado: 200 y al menos un producto."
url: http://localhost:8080/api/products/search?sectionId=24&page=0&size=20
method: GET
scripts:

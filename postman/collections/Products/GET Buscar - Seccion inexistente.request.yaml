$kind: http-request
name: GET Buscar - Seccion inexistente
description: "HT-13 (DP-35). Una sección inexistente, o una subcategoría usada como sección, responde 404. Usa un id que no exista en tu base."
url: http://localhost:8080/api/products/search?sectionId=999999
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("El mensaje nombra el id", function () {
          pm.expect(pm.response.json().message).to.include("999999");
      });
    language: text/javascript
order: 3004

$kind: http-request
name: GET Buscar - Tienda inexistente
description: "HU-06b. Una tienda inexistente o inactiva en el filtro responde 404, igual que una categoría inexistente en el mismo endpoint. Usa un id que no exista en tu base."
url: http://localhost:8080/api/products/search?storeId=999999
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("El mensaje nombra la tienda", function () {
          pm.expect(pm.response.json().message).to.include("999999");
      });
    language: text/javascript
order: 3002

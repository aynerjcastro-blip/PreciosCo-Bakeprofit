$kind: http-request
name: GET Mejor ahorro - Por seccion
description: "HT-13 (DP-39). Lo que muestra la búsqueda sin filtros. Define idSeccionSupermercados. Esperado: 200, una lista de grupos por subcategoría con como máximo limit productos, ordenados por savingsPct de mayor a menor."
url: http://localhost:8080/api/products/best-savings?sectionId={{idSeccionSupermercados}}&limit=5
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Cada subcategoría trae como máximo 5, de mayor a menor ahorro", function () {
          pm.response.json().forEach((grupo) => {
              pm.expect(grupo).to.include.keys("sectionId", "sectionName", "categoryId", "categoryName", "products");
              pm.expect(grupo.products.length).to.be.at.most(5);
              for (let i = 1; i < grupo.products.length; i++) {
                  pm.expect(grupo.products[i].savingsPct).to.be.at.most(grupo.products[i - 1].savingsPct);
              }
          });
      });
    language: text/javascript
order: 3006
